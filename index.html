<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pizza-Rechner</title>
  <meta name="description" content="Pizzateig-Rezepte verwalten, für beliebig viele Pizzen umrechnen und einen Zeitplan mit Erinnerungen erstellen.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pizza-Rechner">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="nav-side nav-left" id="navLeft"></div>
    <div class="nav-title" id="navTitle"></div>

  <nav class="tabbar" id="tabbar" aria-label="Hauptbereiche">
    <a href="#/" data-tab="rezepte">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3.5 19.2a1 1 0 0 0 .9 1.3h15.2a1 1 0 0 0 .9-1.3L12 3Z"/><path d="M5.6 16.5c4.2-1.6 8.6-1.6 12.8 0"/><circle cx="11" cy="12" r="1.3"/><circle cx="13.6" cy="15.6" r="1.1"/><circle cx="9.4" cy="16.4" r="1"/></svg>
      <span>Rezepte</span>
    </a>
    <a href="#/einstellungen" data-tab="einstellungen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>

  </nav>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-nav">
        <button type="button" class="nav-btn" data-sheet-close>Abbrechen</button>
        <div class="sheet-title" id="sheetTitle"></div>
        <button type="button" class="nav-btn bold" id="sheetDone">Fertig</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
