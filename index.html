<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pizza-Rechner</title>
  <meta name="description" content="Pizzateig-Rezepte verwalten, für beliebig viele Pizzen umrechnen und einen Zeitplan mit Erinnerungen erstellen.">
  <meta name="theme-color" content="#fafafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pizza-Rechner">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="globalnav" id="globalnav">
    <div class="gn-inner">
      <a class="gn-logo" href="#/" aria-label="Pizza-Rechner – Startseite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3.5 19.2a1 1 0 0 0 .9 1.3h15.2a1 1 0 0 0 .9-1.3L12 3Z"/><path d="M5.6 16.5c4.2-1.6 8.6-1.6 12.8 0"/><circle cx="11" cy="12" r="1.3"/><circle cx="13.6" cy="15.6" r="1.1"/><circle cx="9.4" cy="16.4" r="1"/></svg>
      </a>
      <nav class="gn-links" aria-label="Hauptnavigation">
        <a href="#/" data-nav="rezepte">Rezepte</a>
        <a href="#/neu" data-nav="neu">Neues Rezept</a>
        <a href="#/einstellungen" data-nav="einstellungen">Einstellungen</a>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <div class="wrap">
      <p class="foot-tip">Tipp: In Safari über <b>Teilen → Zum Home-Bildschirm</b> wird der Pizza-Rechner zur App auf deinem iPhone.</p>
      <div class="foot-links">
        <a href="#/">Rezepte</a>
        <a href="#/neu">Neues Rezept</a>
        <a href="#/einstellungen">Einstellungen</a>
      </div>
      <p class="foot-legal">Pizza-Rechner · Alle Rezepte und Zeiten bleiben auf diesem Gerät gespeichert.</p>
    </div>
  </footer>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <button type="button" class="modal-close" data-sheet-close aria-label="Schließen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
      <h2 class="sheet-title" id="sheetTitle"></h2>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-actions">
        <button type="button" class="pill" id="sheetDone">Fertig</button>
        <button type="button" class="more-btn" data-sheet-close>Abbrechen</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
